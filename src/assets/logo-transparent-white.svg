<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%" aria-label="Viyona Designs Brand Logo - Light/White">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
    
    .brand-title-white {
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 94px;
      letter-spacing: -2px;
      fill: #FFFFFF;
    }
    
    .subtitle-gold {
      font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: #D4AF37;
      letter-spacing: 14px;
    }
  </style>

  <!-- Fully Transparent Canvas - No background rect -->
  <g transform="translate(10, 15)">
    <text x="0" y="90" class="brand-title-white">Viyona</text>
    <text x="6" y="140" class="subtitle-gold">DESIGNS</text>
  </g>
</svg>
