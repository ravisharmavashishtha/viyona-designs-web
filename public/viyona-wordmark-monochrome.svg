<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" aria-label="Viyona Designs Monochrome Wordmark for Trademark Registration">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
    
    .brand-title-mono {
      font-family: 'Outfit', 'Plus Jakarta Sans', 'Product Sans', 'Futura', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 88px;
      fill: #1A1D20;
      letter-spacing: -1.5px;
    }
    
    .subtitle-mono {
      font-family: 'Plus Jakarta Sans', 'Outfit', 'Product Sans', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 26px;
      fill: #1A1D20;
      letter-spacing: 12px;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16"/>

  <g transform="translate(60, 40)">
    <!-- Wordmark "Viyona" -->
    <text x="0" y="100" class="brand-title-mono">Viyona</text>
    <!-- Subtitle "DESIGNS" -->
    <text x="8" y="152" class="subtitle-mono">DESIGNS</text>
  </g>
</svg>
