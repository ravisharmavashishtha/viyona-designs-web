<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%" aria-label="Viyona Designs Luxury Champagne Gold Wordmark">
  <defs>
    <!-- Premium Brushed Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F9F1D0"/>
      <stop offset="75%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#E6C687"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="luxuryGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Cormorant+Garamond:wght@600;700&amp;family=Montserrat:wght@300;400;600&amp;display=swap');

    .luxury-gold-title {
      font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Bodoni MT', serif;
      font-weight: 700;
      font-size: 64px;
      fill: url(#champagneGold);
      letter-spacing: 14px;
      filter: url(#luxuryGlow);
    }
  </style>

  <!-- Deep Obsidian Matte Background -->
  <rect width="100%" height="100%" fill="#0B0B0B" rx="16"/>

  <g transform="translate(60, 130)">
    <!-- Single Line Luxury Wordmark "VIYONA DESIGNS" -->
    <text x="0" y="0" class="luxury-gold-title">VIYONA DESIGNS</text>
  </g>
</svg>
