<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-label="Viyona Designs Luxury Monogram VD">
  <defs>
    <linearGradient id="luxuryGoldMonogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#F9F1D0"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;display=swap');
    
    .monogram-text {
      font-family: 'Cinzel', 'Didot', serif;
      font-weight: 700;
      font-size: 190px;
      fill: url(#luxuryGoldMonogram);
      letter-spacing: -12px;
    }
  </style>

  <!-- Deep Obsidian Rounded Squircle -->
  <rect width="512" height="512" rx="100" fill="#0B0B0B"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="url(#luxuryGoldMonogram)" stroke-width="3" opacity="0.6"/>

  <g transform="translate(256, 310)">
    <text x="0" y="0" text-anchor="middle" class="monogram-text">VD</text>
  </g>
</svg>
