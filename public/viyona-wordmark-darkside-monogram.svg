<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-label="Viyona Designs Dark Side Monogram Icon">
  <defs>
    <linearGradient id="darkTitaniumMono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;display=swap');
    
    .darkside-monogram-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 210px;
      fill: url(#darkTitaniumMono);
      letter-spacing: -14px;
    }
  </style>

  <!-- Deep Obsidian Dark Base -->
  <rect width="512" height="512" rx="110" fill="#090A0F"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#darkTitaniumMono)" stroke-width="4" opacity="0.4"/>

  <g transform="translate(256, 325)">
    <text x="0" y="0" text-anchor="middle" class="darkside-monogram-text">VD</text>
  </g>
</svg>
