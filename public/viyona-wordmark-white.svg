<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%" aria-label="Viyona Designs Ultra Thick Single Line Wordmark - White Background">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Syne:wght@800;900&amp;display=swap');

    .thick-dark-title {
      font-family: 'Outfit', 'Syne', 'Product Sans', -apple-system, sans-serif;
      font-weight: 900;
      font-size: 82px;
      fill: #0B0B0C;
      letter-spacing: -1px;
    }
  </style>

  <!-- Pure White Solid Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16"/>

  <g transform="translate(50, 130)">
    <!-- Single Line Ultra Thick Wordmark "Viyona Designs" -->
    <text x="0" y="0" class="thick-dark-title">Viyona Designs</text>
  </g>
</svg>
