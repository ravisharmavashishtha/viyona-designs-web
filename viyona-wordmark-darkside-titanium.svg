<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%" aria-label="Viyona Designs Dark Side Stealth Titanium Ultra Thick Single Line Wordmark">
  <defs>
    <!-- Stealth Dark Metallic Titanium Gradient -->
    <linearGradient id="stealthTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Metallic Shadow Filter -->
    <filter id="darkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&amp;family=Syne:wght@800;900&amp;display=swap');

    .darkside-thick-title {
      font-family: 'Outfit', 'Syne', 'Product Sans', sans-serif;
      font-weight: 900;
      font-size: 80px;
      fill: url(#stealthTitanium);
      letter-spacing: -0.5px;
      filter: url(#darkGlow);
    }
  </style>

  <!-- Midnight Obsidian Dark Background -->
  <rect width="100%" height="100%" fill="#090A0F" rx="16"/>

  <g transform="translate(50, 140)">
    <!-- Single Line Ultra Thick Wordmark "Viyona Designs" -->
    <text x="0" y="0" class="darkside-thick-title">Viyona Designs</text>
  </g>
</svg>
