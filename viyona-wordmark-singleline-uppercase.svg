<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%" aria-label="Viyona Designs Single Line Uppercase Heavy Wordmark">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&amp;family=Outfit:wght@900&amp;display=swap');
    
    .singleline-caps-title {
      font-family: 'Space Grotesk', 'Outfit', 'Product Sans', sans-serif;
      font-weight: 800;
      font-size: 72px;
      fill: #000000;
      letter-spacing: 4px;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16"/>

  <g transform="translate(45, 125)">
    <!-- Single Line Uppercase "VIYONA DESIGNS" -->
    <text x="0" y="0" class="singleline-caps-title">VIYONA DESIGNS</text>
  </g>
</svg>
